# nagmapReborn hardening. Loaded before thruk_cookie_auth.conf on purpose: that
# file's <LocationMatch> grants "Allow from all / Satisfy any" for the whole
# site (overriding any <Directory>/<Files> Require), and its rewrite chain ends
# in [L] - so these URL-level [F] rules must run first.
RewriteEngine On

# VCS/dev/doc data, PHP includes, the writable cache, config and version files
RewriteRule ^/default/nagmap/(?:\.|cache(?:/|$)|src(?:/|$)|docs(?:/|$)|contrib(?:/|$)|config\.php|[^/]*\.md$|VERSION$) - [F,NC]

# Only the four web entry points may be executed as PHP
RewriteRule ^/default/nagmap/(?!(?:index|initializer|update|downtime)\.php$).*\.(?:php\d*|phtml|phar|inc)$ - [F,NC]
