# Synthetic "nagios.cfg" for nagmapReborn's config.php (general.cfg_file).
#
# nagmapReborn parses this file's cfg_file/cfg_dir lines itself (see
# src/NagmapReborn/functions.php:getConfigFiles()) and requires absolute
# paths - it does not understand OMD's naemon.cfg config_rel_path
# indirection, so it cannot be pointed at naemon.d/000_omd.cfg directly.
cfg_dir=/omd/sites/default/etc/naemon/conf.d
