# nagmapReborn network map, served at /default/nagmap

Alias /default/nagmap "/omd/sites/default/var/nagmapReborn"
<Directory /omd/sites/default/var/nagmapReborn>
    Options -Indexes +FollowSymlinks
    AllowOverride None
    DirectoryIndex index.php

    # Only the four web entry points may be executed as PHP; everything else
    # (src/ includes, compiled i18n cache, config.php, any dropped file) is refused.
    <FilesMatch "\.(?i:php\d*|phtml|phar|inc)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(index|initializer|update|downtime)\.php$">
        Require all granted
    </FilesMatch>

    # Dotfiles, docs and version/config files
    <FilesMatch "^(\..*|.*\.md|config\.php(\.example)?|VERSION)$">
        Require all denied
    </FilesMatch>
</Directory>

# Never serve VCS data, PHP includes, the writable cache or dev/docs folders
<DirectoryMatch "^/omd/sites/default/var/nagmapReborn/(\.git|\.claude|cache|src|docs|contrib)(/|$)">
    Require all denied
</DirectoryMatch>
